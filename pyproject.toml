[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=75.3.0", "wheel>=0.40.0"]

[project]
name = "lncrawl-mini"
version = "0.1.0"
description = "Minimal web-novel downloader: crawl a novel URL and export EPUB + TXT. zh + vn sources only."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "lncrawl-scraper[all]~=1.7.0",
  "beautifulsoup4>=4.0.0,<5.0.0",
  "ebooklib>=0.18.0,<1.0.0",
  "lxml>=5.4.0,<7.0.0",
  "pillow>=10.0.0",
  "python-slugify>=8.0.0,<9.0.0",
  "python-dotenv>=1.0.0,<2.0.0",
  "tqdm>=4.66.0,<5.0.0",
  "fastapi>=0.128.8",
  "uvicorn[standard]>=0.39.0",
]

[project.scripts]
lncrawl-mini = "lncrawl.app:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["lncrawl*", "sources*"]
where = ["."]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["I", "E", "W", "F"]
ignore = ["E203", "E265", "E501"]
